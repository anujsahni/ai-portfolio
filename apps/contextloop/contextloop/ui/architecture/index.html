<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextLoop architecture</title>
<link rel="stylesheet" href="architecture.css">
</head>
<body>
<div class="arch" id="arch">
  <div class="top">
    <h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <defs>
    <linearGradient id="cl-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B5BDC"/><stop offset="1" stop-color="#13B3A4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#cl-grad)"/>
  <path d="M44.1 23.2 A15 15 0 1 0 44.1 40.8" fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="round"/>
  <circle cx="46.2" cy="32" r="4.6" fill="#FF7A5C"/>
</svg><span>ContextLoop · architecture</span></h1>
    <div class="controls">
      <div class="seg mode"><button data-mode="acts" class="on" title="Highlight what each act uses">Walk the acts</button><button data-mode="build" title="Add each act's layer until the architecture is complete">Build it up</button></div>
      <div class="seg view"><button data-view="laptop" class="on">On this laptop</button><button data-view="customer">At a customer</button></div>
      <button class="prev" title="Previous (left arrow key)" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="stepname kbd"></span>
      <button class="next" title="Next (right arrow key)" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="play" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"/></svg> Play request flow</button>
      <button class="theme" title="Light or dark" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="caption"></div>
  <div class="canvas">
    <svg class="edges"></svg>
    <div class="bands"></div>
    <div class="app-row"></div>
    <div class="card"></div>
  </div>
  <div class="netnote"></div>
  <div class="legend">
    <span><i style="border-color:var(--k-source);background:var(--b-source)"></i>Source</span>
    <span><i style="border-color:var(--k-fivetran);background:var(--b-fivetran)"></i>Fivetran</span>
    <span><i style="border-color:var(--k-dbt);background:var(--b-dbt)"></i>dbt</span>
    <span><i style="border-color:var(--k-open);background:var(--b-open)"></i>Open source / lakehouse</span>
    <span><i style="border-color:var(--k-app);background:var(--b-app)"></i>ContextLoop code</span>
    <span><i style="border-color:var(--k-ai);background:var(--b-ai)"></i>Claude</span>
    <span class="kbd">Hover a box for details · click to pin · arrow keys step through the acts</span>
  </div>
</div>
<script src="architecture.js"></script>
</body>
</html>
